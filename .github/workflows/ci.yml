name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  PYTHONPATH: src
  TF_CPP_MIN_LOG_LEVEL: "3"

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Deliberately NOT requirements-dev.txt: that file also pulls in
      # tensorflow-cpu, and this job exists to prove the opposite path --
      # that hwval.ml works with TensorFlow absent and falls back to the PCA
      # autoencoder (see hwval.ml.train_tf's import guard). Test tooling is
      # installed directly instead.
      - name: Install dependencies (no TensorFlow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Confirm TensorFlow is not importable in this job
        run: |
          python -c "
          import sys
          try:
              import tensorflow  # noqa: F401
              sys.exit('tensorflow unexpectedly importable — this job must run without it')
          except ImportError:
              print('tensorflow absent, as expected')
          "

      - name: ruff check
        run: ruff check .

      - name: pytest (SQLite, no TensorFlow)
        env:
          # A throwaway SQLite DB in the runner's temp dir -- never the repo's
          # own artifacts/, so a local `make test` and CI never collide.
          DATABASE_URL: "sqlite:////tmp/hwval_ci_${{ matrix.python-version }}/hwval_test.db"
        run: |
          mkdir -p "/tmp/hwval_ci_${{ matrix.python-version }}"
          pytest --cov=hwval --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Proves the Postgres path end to end (schema DDL, dialect-aware maintenance
  # queries, real pg_stat_* catalogue access) rather than only ever exercising
  # the SQLite fallback used by the `test` job above.
  #
  # Verified locally against a real postgres:16 server before enabling this
  # job: `hwval init`, `hwval seed --duts 10`, `hwval maintain` and
  # `hwval evaluate` all complete successfully with exit code 0 against
  # Postgres, with no model trained yet (evaluate degrades to the
  # limit-screen-only comparison, exactly like the SQLite path in `test`
  # above -- this job intentionally does not call `hwval train`).
  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hwval
          POSTGRES_PASSWORD: hwval
          POSTGRES_DB: hwval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hwval -d hwval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://hwval:hwval@localhost:5432/hwval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: hwval init
        run: python -m hwval.cli init --drop

      - name: hwval seed --duts 10
        run: python -m hwval.cli seed --duts 10

      - name: hwval maintain (dry run, exercises pg_stat_* catalogues)
        run: python -m hwval.cli maintain

      - name: hwval evaluate (limit-screen baseline against real Postgres)
        run: python -m hwval.cli evaluate
